<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tami | Websites & Business Automation</title>
    <meta
      name="description"
      content="Tami builds websites, online stores, Telegram chatbots and n8n/Zapier automations for businesses in Nigeria and worldwide."
    />
    <meta name="theme-color" content="#0b0b0c" />
    <script>
      // Apply the saved theme before the page draws, so it never flashes the wrong one. Dark is the site's main look.
      (function () {
        var t = null;
        try { t = localStorage.getItem("tami-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = "dark";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <meta property="og:title" content="Tami | Websites & Business Automation" />
    <meta property="og:description" content="Websites and automations that keep your business moving." />
    <meta property="og:image" content="/images/tami.webp" />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500..900&family=Figtree:wght@300..700&family=IBM+Plex+Mono:wght@400;500&family=Kaushan+Script&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
